name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-free:
    name: core is dependency-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert core/ imports only the standard library
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path("kharcha/core").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          continue
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      root = name.split(".")[0]
                      if root == "kharcha":
                          continue
                      if root not in sys.stdlib_module_names:
                          bad.append(f"{path}:{node.lineno} imports {name!r}")
          if bad:
              print("core/ must stay dependency-free:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("OK: core/ imports only the standard library")
          PY

  test:
    name: ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/ -v
      - name: CLI smoke test
        shell: bash
        run: |
          python -m kharcha.cli --db ci.db demo --days 10
          python -m kharcha.cli --db ci.db budget set team-a 500
          python -m kharcha.cli --db ci.db report --inr-rate 83.5
          python -m kharcha.cli --db ci.db report --markdown
          python -m kharcha.cli --db ci.db waste --json
          python -m kharcha.cli --db ci.db budget list
